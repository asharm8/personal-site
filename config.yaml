  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/AbhiSharma.jpg"
    content: |-
      I'm a technical lead who has spent more than 15 years designing and delivering web platforms — from Drupal intranets and
      public-sector sites to composable eCommerce stacks (Drupal + Magento + Akeneo) serving brands like Wilson Sporting Goods.

      My work spans the full lifecycle: discovery, estimation, architecture, and leading distributed teams to ship measurable
      outcomes. At Bounteous I moved from senior developer to solutions lead, shaping enterprise RFPs and SOWs that influenced
      $10MM+ in contracted work.

      Today I'm part of the leadership team at [Insurance World Agency](https://www.iwainsurance.com), an independent
      agency (est. 1998) that quotes 50+ carriers for clients in Illinois and 25+ states. As a licensed Property & Casualty
      producer, I run day-to-day operations and own the agency's technology: the website, quoting and intake flows, carrier
      integrations, and the automations that let a small team serve clients like a much larger one.

      So whether you need help with a web platform or want a second opinion on your auto, home, or business coverage, I'm glad to talk.
    skills:
      enable: true
      title: "Technologies I work with:"
      items:
        - "Drupal (7/8/9/10)"
        - "Acquia Site Studio"
        - "PHP"
        - "JavaScript / Node.js"
        - "React"
        - "Python"
        - "Magento"
        - "Akeneo PIM"
        - "WordPress"
        - "Symfony"
        - "SQL / MySQL"
        - "Docker & Linux"
        - "AWS"
        - "CI/CD"
        - "n8n & API integrations"

