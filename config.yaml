  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/AbhiSharma.jpg"
    content: |-
      I'm a technical lead who has spent more than 15 years designing and delivering web platforms — from Drupal intranets and
      public-sector sites to composable eCommerce stacks (Drupal + Magento + Akeneo) serving brands like Wilson Sporting Goods.

      My work spans the full lifecycle: discovery, estimation, architecture, and leading distributed teams to ship measurable
      outcomes. At Bounteous I moved from senior developer to solutions lead, shaping enterprise RFPs and SOWs that influenced
      $10MM+ in contracted work.

      These days I lead operations and technology at Insurance World Agency, where I apply the same engineering mindset to a
      small business: modernizing the web presence, wiring systems together with APIs, and automating the repetitive work so
      the team can focus on clients.
    skills:
      enable: true
      title: "Technologies I work with:"
      items:
        - "Drupal (7/8/9/10)"
        - "Acquia Site Studio"
        - "PHP"
        - "JavaScript / Node.js"
        - "React"
        - "Python"
        - "Magento"
        - "Akeneo PIM"
        - "WordPress"
        - "Symfony"
        - "SQL / MySQL"
        - "Docker & Linux"
        - "AWS"
        - "CI/CD"
        - "n8n & API integrations"

